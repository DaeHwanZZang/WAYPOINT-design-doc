roke="#1C6E8C" stroke-width="1.4"/><text x="300.0" y="112.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">acquire_floor: 층 정원 안?</text><rect x="560" y="85" width="400" height="46" rx="6" fill="#F3F5F7" stroke="#4B5563" stroke-width="1.5"/><text x="760.0" y="112.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">대기 이유: 층별 동시 이동 대수 제한</text><path d="M300.0 155 L500 180.0 L300.0 205 L100 180.0 Z" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.4"/><text x="300.0" y="184.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">출구 통과(last_node = exit) ∧ 차체 외접원이 존 밖?</text><rect x="560" y="155" width="400" height="50" rx="6" fill="#E6F4EC" stroke="#2E8B57" stroke-width="1.5"/><text x="760.0" y="184.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">crossing done → 다음 crossing 검사</text><path d="M300.0 230 L500 253.0 L300.0 276 L100 253.0 Z" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.4"/><text x="300.0" y="257.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">이미 내 존 예약? (같은 order)</text><rect x="560" y="230" width="400" height="46" rx="6" fill="#E6F4EC" stroke="#2E8B57" stroke-width="1.5"/><text x="760.0" y="257.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">through = 출구 node (허가 유지)</text><path d="M300.0 300 L500 323.0 L300.0 346 L100 323.0 Z" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.4"/><text x="300.0" y="327.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">대기 node 예약이 남의 것?</text><rect x="560" y="300" width="400" height="46" rx="6" fill="#FDEEE3" stroke="#E8590C" stroke-width="1.5"/><text x="760.0" y="327.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">through = 대기 node 직전 · &#x27;대기 node 사용 중&#x27;</text><path d="M300.0 370 L500 395.0 L300.0 420 L100 395.0 Z" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.4"/><text x="300.0" y="390.9" font-size="12.5" text-anchor="middl