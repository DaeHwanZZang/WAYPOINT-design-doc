<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif"><title>계획 — 장애 작업 자동 재배정 JobCoordinator.fail_lost() (1초 tick)</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16202B"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#16202B" stroke-width="1.4"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1C6E8C"/></marker><marker id="bo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#1C6E8C" stroke-width="1.4"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E8590C"/></marker><marker id="oo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#E8590C" stroke-width="1.4"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4B5563"/></marker><marker id="go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#4B5563" stroke-width="1.4"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C0392B"/></marker><marker id="ro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#C0392B" stroke-width="1.4"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6D4AE0"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6D4AE0" stroke-width="1.4"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2E8B57"/></marker><marker id="gro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#2E8B57" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><circle cx="60" cy="40" r="9" fill="#16202B"/><path d="M290.0 15 L480 40.0 L290.0 65 L100 40.0 Z" fill="#FDEEE3" stroke="#E8590C" stroke-width="1.4"/><text x="290.0" y="44.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">작업 중 로봇 liveness ∈ {LOST, STALE}?</text><rect x="540" y="15" width="420" height="50" rx="6" fill="#F3F5F7" stroke="#4B5563" stroke-width="1.5"/><text x="750.0" y="44.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">아무것도 안 함 (FATAL 은 _advance 가 이미 failed 처리)</text><path d="M290.0 90 L480 115.0 L290.0 140 L100 115.0 Z" fill="#FDEEE3" stroke="#E8590C" stroke-width="1.4"/><text x="290.0" y="119.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">LOST: 즉시 / STALE: 3초 + 유예 2초 경과?</text><rect x="540" y="90" width="420" height="50" rx="6" fill="#F3F5F7" stroke="#4B5563" stroke-width="1.5"/><text x="750.0" y="119.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">다음 tick 에 다시 (통신 순간 끊김 오판 방지)</text><path d="M290.0 165 L480 190.0 L290.0 215 L100 190.0 Z" fill="#FDEEE3" stroke="#E8590C" stroke-width="1.4"/><text x="290.0" y="194.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">승강기 칸 안 작업? (in_car)</text><rect x="540" y="165" width="420" height="50" rx="6" fill="#FBE9E7" stroke="#C0392B" stroke-width="1.5"/><text x="750.0" y="194.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">자동 재배정 안 함 → elevator_attention 알림, 운영자 복구(SC-11)</text><rect x="100" y="240" width="380" height="50" rx="6" fill="#FDEEE3" stroke="#E8590C" stroke-width="1.5"/><text x="290.0" y="269.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">job → failed(robot_lost) · 실패 사유·시각 기록</text><rect x="100" y="310" width="380" height="50" rx="6" fill="#FDEEE3" stroke="#E8590C" stroke-width="1.5"/><text x="290.0" y="330.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">재시도 작업 생성: 같은 명령 · resume_from = done_commands</text><text x="290.0" y="347.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">retry_of = 원본 · priority 유지</text><rect x="100" y="380" width="380" height="50" rx="6" fill="#FBE9E7" stroke="#C0392B" stroke-width="1.5"/><text x="290.0" y="409.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">교통 예약은 그대로 (퇴장 증거 없음) · 존 상태 &#x27;확인 필요&#x27;</text><rect x="100" y="450" width="380" height="50" rx="6" fill="#FDEEE3" stroke="#E8590C" stroke-width="1.5"/><text x="290.0" y="479.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">job.retry_auto · job.failed 이벤트 → 다음 tick 배정</text><rect x="540" y="240" width="420" height="260" rx="14" fill="#F3F5F7" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4"/><text x="750.0" y="309.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">· 재시도 작업의 경로 선택은 &#x27;확인 필요&#x27; 존을 막힌 존으로 본다</text><text x="750.0" y="325.2" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">  (ZonePlanner 에 그 존을 장애물로 넘김) → 우회하거나 대기 node 앞에서 기다린다.</text><text x="750.0" y="341.5" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">· 네트워크만 끊긴 로봇은 허가 구간까지 계속 달릴 수 있다.</text><text x="750.0" y="357.8" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">  허가 밖으로는 못 가므로 충돌은 없지만 같은 운반을 두 번 할 수 있다.</text><text x="750.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">· 그래서 재접속한 로봇이 종료된 작업의 order_id 를 보고하면</text><text x="750.0" y="390.2" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">  FMS 가 즉시 CANCEL_ORDER 를 보낸다(중복 실행 차단).</text><text x="750.0" y="406.5" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500"></text><text x="750.0" y="422.8" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">목표 시간: kill → LWT 로 즉시 LOST → 다음 tick(≤1초) 재시도 생성</text><text x="750.0" y="439.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">→ 그다음 tick(≤1초) 배정 = 재배정 5초 이내 (NFR-04)</text><path d="M60.0 40.0 L100.0 40.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M480.0 40.0 L540.0 40.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><rect x="488.5" y="31.0" width="43.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="510.0" y="43.0" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="400">아니오</text><path d="M290.0 65.0 L290.0 90.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><rect x="279.5" y="68.5" width="21.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="290.0" y="80.5" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="400">예</text><path d="M480.0 115.0 L540.0 115.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><rect x="488.5" y="106.0" width="43.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="510.0" y="118.0" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="400">아니오</text><path d="M290.0 140.0 L290.0 165.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><rect x="279.5" y="143.5" width="21.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="290.0" y="155.5" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="400">예</text><path d="M480.0 190.0 L540.0 190.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><rect x="499.5" y="181.0" width="21.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="510.0" y="193.0" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="400">예</text><path d="M290.0 215.0 L290.0 240.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><rect x="268.5" y="218.5" width="43.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="290.0" y="230.5" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="400">아니오</text><path d="M290.0 290.0 L290.0 310.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M290.0 360.0 L290.0 380.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M290.0 430.0 L290.0 450.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/></svg>