9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C0392B"/></marker><marker id="ro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#C0392B" stroke-width="1.4"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6D4AE0"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6D4AE0" stroke-width="1.4"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2E8B57"/></marker><marker id="gro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#2E8B57" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="20" y="160" width="520" height="455" rx="10" fill="#FBE9E7" fill-opacity=".45" stroke="#C0392B" stroke-dasharray="6 4"/><text x="32.0" y="180.0" font-size="12.5" text-anchor="start" fill="#C0392B" font-weight="700">dispatch(job, robot) — 최종 가용성 재검사</text><circle cx="60" cy="40" r="9" fill="#16202B"/><path d="M205.0 15 L300 40.0 L205.0 65 L110 40.0 Z" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.4"/><text x="205.0" y="44.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">MQTT 연결됨?</text><rect x="340" y="15" width="210" height="50" rx="6" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.5"/><text x="445.0" y="35.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">tick_traffic()</text><text x="445.0" y="52.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">tick_multifloor()</text><rect x="590" y="15" width="380" height="50" rx="6" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.5"/><text x="780.0" y="35.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">대기 작업 정렬: auto_assign ∧ pending</text><text x="780.0" y="52.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">키 (−priority, created_at, job_id)</text><rect x="590" y="95" width="380" height="46" rx="6" fill="#F3F5F7" stroke="#4B5563" stroke-width="1.5"/><text x="780.0" y="122.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">마감 지남 → deadline_missed 이벤트만 (작업 계속)</text><path d="M780.0 160 L970 185.0 L780.0 210 L590 185.0 Z" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.4"/><text x="780.0" y="189.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">not_before 전? / 현장 배정 차단?</text><rect x="590" y="240" width="380" height="56" rx="6" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.5"/><text x="780.0" y="263.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">후보 = available_robots() ∩ 현장 등록</text><text x="780.0" y="280.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">(직접 지정이면 그 로봇만, 정지된 맵 제외)</text><rect x="590" y="320" width="380" height="66" rx="6" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.5"/><text x="780.0" y="340.8" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">rank_candidates(): eligible() 로 거르고</text><text x="780.0" y="357.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">비용 = 경로거리 + 60m × 환승 + 0.2 × (100 − 잔량)</text><text x="780.0" y="373.2" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">+ (계획) 예상 대기 × 평균 속도</text><rect x="590" y="410" width="380" height="50" rx="6" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.5"/><text x="780.0" y="439.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">순위대로 dispatch(job, robot) 시도</text><rect x="590" y="485" width="180" height="46" rx="6" fill="#E6F4EC" stroke="#2E8B57" stroke-width="1.5"/><text x="680.0" y="512.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">성공 → 다음 작업</text><rect x="790" y="485" width="180" height="46" rx="6" fill="#FDEEE3" stroke="#E8590C" stroke-width="1.5"/><text x="880.0" y="512.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">전부 실패 → 대기 이유 기록</text><rect x="790" y="555" width="180" height="46" rx="6" fill="#F3F5F7" stroke="#4B5563" stroke-width="1.5"/><text x="880.0" y="573.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">_preempt_staging()</text><text x="880.0" y="590.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">(대기 복귀 로봇 선점)</text><rect x="40" y="195" width="480" height="40" rx="6" fill="#F3F5F7" stroke="#16202B" stroke-width="1.5"/><text x="280.0" y="219.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">MQTT 연결 · job 이 pending · 로봇에 활성 작업 없음</text><rect x="40" y="245" width="480" height="40" rx="6" fill="#F3F5F7" stroke="#16202B" stroke-width="1.5"/><text x="280.0" y="269.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">State 수신 · 잔량 &gt; 0 · (정책) 잔량 ≥ min_job_charge</text><rect x="40" y="295" width="480" height="40" rx="6" fill="#F3F5F7" stroke="#16202B" stroke-width="1.5"/><text x="280.0" y="319.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">available_for_job: ONLINE ∧ IDLE ∧ AUTO ∧ ¬paused ∧ LOCALIZED</text><rect x="40" y="345" width="480" height="40" rx="6" fill="#F3F5F7" stroke="#16202B" stroke-width="1.5"/><text x="280.0" y="369.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">현장 등록 · in_service · 맵 uid 일치 · 맵 version = 활성</text><rect x="40" y="395" width="480" height="40" rx="6" fill="#F3F5F7" stroke="#16202B" stroke-width="1.5"/><text x="280.0" y="419.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">다층이면 _dispatch_multi (승강기 stage 계획)</text><rect x="40" y="445" width="480" height="50" rx="6" fill="#F3F5F7" stroke="#16202B" stroke-width="1.5"/><text x="280.0" y="465.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">compile_to_order → traffic.prepare(대기·출구 node 삽입)</text><text x="280.0" y="482.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">→ traffic.update(초기 허가)</text><rect x="40" y="505" width="480" height="40" rx="6" fill="#F3F5F7" stroke="#16202B" stroke-width="1.5"/><text x="280.0" y="529.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">status=assigned · jobs.json 저장 (발행 전 저장)</text><rect x="40" y="555" width="480" height="40" rx="6" fill="#F3F5F7" stroke="#16202B" stroke-width="1.5"/><text x="280.0" y="579.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">publish_order → job.assigned 이벤트</text><path d="M60.0 40.0 L110.0 40.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M300.0 40.0 L340.0 40.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><rect x="309.5" y="31.0" width="21.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="320.0" y="43.0" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="400">예</text><path d="M550.0 40.0 L590.0 40.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M780.0 65.0 L780.0 95.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M780.0 141.0 L780.0 160.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M780.0 210.0 L780.0 240.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><rect x="758.5" y="216.0" width="43.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="780.0" y="228.0" font-size="11" text-anchor=