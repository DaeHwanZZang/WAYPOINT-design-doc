.4" marker-end="url(#a)"/><text x="399.2" y="153.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="400">GET</text><text x="399.2" y="171.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="400">…/maps/{map}/traffic</text><line x1="304.4" y1="178.0" x2="488.0" y2="178.0" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><text x="588.8" y="211.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="400">snapshot(): 정원,</text><text x="588.8" y="229.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="400">예약, 존 상태, 대기</text><text x="588.8" y="247.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="400">작업, 교착·정체,</text><text x="588.8" y="265.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="400">장애물</text><line x1="494.0" y1="272.0" x2="677.6" y2="272.0" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><text x="399.2" y="305.0" font-size="15" text-anchor="middle" fill="#4B5563" font-weight="400">표시</text><line x1="494.0" y1="312.0" x2="310.4" y2="312.0" stroke="#4B5563" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#go)"/><text x="209.6" y="345.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="400">동시 이동 대수 · 경로</text><text x="209.6" y="363.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="400">교차 정지 · 통로 선택</text><text x="209.6" y="381.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="400">정책 [적용]</text><line x1="114.8" y1="388.0" x2="298.4" y2="388.0" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><text x="399.2" y="421.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="400">PUT …/traffic</text><text x="399.2" y="439.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="400">{max_moving_robots,</text><text x="399.2" y="457.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="400">conflict_pause,</text><text x="399.2" y="475.0" font-size="15" text-a