d)</text><line x1="714.3" y1="424.0" x2="862.6" y2="424.0" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><text x="251.4" y="485.0" font-size="15" text-anchor="middle" fill="#E8590C" font-weight="400">INJECT_FAULT(유형) · 주입 시각 기록</text><line x1="97.1" y1="492.0" x2="399.7" y2="492.0" stroke="#E8590C" stroke-width="1.4" marker-end="url(#o)"/><text x="328.6" y="545.0" font-size="15" text-anchor="middle" fill="#E8590C" font-weight="400">GET /events?run_id= → events.jsonl</text><line x1="97.1" y1="552.0" x2="554.0" y2="552.0" stroke="#E8590C" stroke-width="1.4" marker-end="url(#o)"/><text x="560.0" y="585.0" font-size="15" text-anchor="middle" fill="#E8590C" font-weight="400">지표 요약 · CPU 사용률 · 무효 판정</text><line x1="97.1" y1="592.0" x2="1016.9" y2="592.0" stroke="#E8590C" stroke-width="1.4" marker-end="url(#o)"/><text x="251.4" y="625.0" font-size="15" text-anchor="middle" fill="#E8590C" font-weight="400">종료 (SIGTERM → OFFLINE)</text><line x1="97.1" y1="632.0" x2="399.7" y2="632.0" stroke="#E8590C" stroke-width="1.4" marker-end="url(#o)"/><rect x="23.0" y="18" width="148.3" height="54" rx="6" fill="#FDEEE3" stroke="#E8590C" stroke-width="1.5" stroke-dasharray="5 3"/><text x="97.1" y="37.7" font-size="12.808807733619764" text-anchor="middle" fill="#16202B" font-weight="600">실험 러너</text><text x="97.1" y="54.3" font-size="12.808807733619764" text-anchor="middle" fill="#16202B" font-weight="600">(run_experiment.py)</text><rect x="201.4" y="18" width="100.0" height="54" rx="6" fill="#F3F5F7" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 3"/><text x="251.4" y="46.0" font-size="15" text-anchor="middle" fill="#16202B" font-weight="600">브로커</text><rect x="331.6" y="18" width="148.3" height="54" rx="6" fill="#EEE9FD" stroke="#6D4AE0" stroke-width="1.5"/><text x="405.7" y="37.2" font-size="13.520408163265305" text-anchor="middle" fill="#16202B" font-weight="600">로봇 프로세스</text><text x="405.7" y="54.8" font-size="13.520408163265305" text-anchor="middle" fill="#162