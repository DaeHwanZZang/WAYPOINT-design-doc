idth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C0392B"/></marker><marker id="ro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#C0392B" stroke-width="1.4"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6D4AE0"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6D4AE0" stroke-width="1.4"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2E8B57"/></marker><marker id="gro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#2E8B57" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="330" y="260" width="300" height="120" rx="10" fill="#FBE9E7" fill-opacity=".45" stroke="#C0392B" stroke-dasharray="6 4"/><text x="342.0" y="280.0" font-size="12.5" text-anchor="start" fill="#C0392B" font-weight="700">점유 존 Z2 (우회 통로)</text><rect x="330" y="30" width="300" height="120" rx="10" fill="#FBE9E7" fill-opacity=".45" stroke="#C0392B" stroke-dasharray="6 4"/><text x="342.0" y="50.0" font-size="12.5" text-anchor="start" fill="#C0392B" font-weight="700">점유 존 Z1 (주 통로, 1대 폭)</text><rect x="30" y="170" width="120" height="50" rx="14" fill="#EEE9FD" stroke="#6D4AE0" stroke-width="1.5"/><text x="90.0" y="199.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">출발 (로봇 위치)</text><rect x="200" y="70" width="110" height="44" rx="6" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.5"/><text x="255.0" y="87.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">Z1 대기 node</text><text x="255.0" y="104.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">(서쪽 gate)</text><rect x="650" y="70" width="110" height="44" rx="6" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.5"/><text x="705.0" y="87.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">Z1 출구 node</text><text x="705.0" y="104.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">(동쪽)</text><rect x="200" y="300" width="110" height="44" rx="6" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.5"/><text x="255.0" y="326.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">Z2 대기 node</text><rect x="650" y="300" width="110" height="44" rx="6" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.5"/><text x="705.0" y="326.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">Z2 출구 node</text><rect x="840" y="170" width="130" height="50" rx="14" fill="#E6F4EC" stroke="#2E8B57" stroke-width="1.5"/><text x="905.0" y="199.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">목적지</text><rect x="30" y="400" width="940" height="52" rx="14" fill="#F3F5F7" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4"/><text x="500.0" y="421.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">간선 비용 = 격자 A* 거리(m). 출발·출구 → 대기·목적지 간선은 모든 존을 벽으로 막고, 대기 → 출구 간선만 그 존을 연다.</text><text x="500.0" y="438.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">현재(distance): Z1 경로 5+14+6 = 25 m &lt; Z2 경로 9+18+9 = 36 m → Z1.  계획(rule/ai): 대기→출구 간선에 &#x27;예상 대기(초) × 평균 속도&#x27;를 더해 Z1 이 붐비면 Z2 선택</text><path d="M130.0 170.0 L219.8 114.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><rect x="160.7" y="133.0" width="28.5" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="174.9" y="145.0" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="400">5 m</text><path d="M310.0 92.0 L650.0 92.0" fill="none" stroke="#E8590C" stroke-width="1.4" marker-end="url(#o)"/><rect x="422.2" y="83.0" width="115.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="480.0" y="95.0" font-size="11" text-anchor="middle" fill="#E8590C" font-weight="400">14 m (+ 예상 대기)</text><path d="M747.7 114.0 L856.5 170.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><rect x="787.8" y="133.0" width="28.5" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="802.1" y="145.0" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="400">6 m</text><path d="M122.5 220.0 L226.4 300.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><rect x="160.2" y="251.0" width="28.5" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="174.4" y="263.0" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="400">9 m</text><path d="M310.0 322.0 L650.0 322.0" fill="none" stroke="#E8590C" stroke-width="1.4" marker-end="url(#o)"/><rect x="422.2" y="313.0" width="115.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="480.0" y="325.0" font-size="11" text-anchor="middle" fill="#E8590C" font-weight="400">18 m (+ 예상 대기)</text><path d="M739.6 300.0 L865.6 220.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><rect x="788.4" y="251.0" width="28.5" height="16" rx="3" fill="#fff" fill-opacity=".92"/><text x="802.6" y="263.0" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="400">9 m</text></svg>