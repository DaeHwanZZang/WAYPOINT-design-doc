<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif"><title>AI-3 이상 탐지 — 정상 창만으로 학습한 Autoencoder, 재구성 오차가 점수·근거</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16202B"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#16202B" stroke-width="1.4"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1C6E8C"/></marker><marker id="bo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#1C6E8C" stroke-width="1.4"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E8590C"/></marker><marker id="oo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#E8590C" stroke-width="1.4"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4B5563"/></marker><marker id="go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#4B5563" stroke-width="1.4"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C0392B"/></marker><marker id="ro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#C0392B" stroke-width="1.4"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6D4AE0"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6D4AE0" stroke-width="1.4"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2E8B57"/></marker><marker id="gro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#2E8B57" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="20" y="60" width="170" height="220" rx="6" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.5"/><text x="105.0" y="149.6" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">입력 x (54)</text><text x="105.0" y="165.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">최근 6창 × 9특징</text><text x="105.0" y="182.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">(1초 간격, 창 10초)</text><text x="105.0" y="198.4" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">표준화(학습 세트 통계)</text><rect x="230" y="80" width="90" height="180" rx="6" fill="#FDEEE3" stroke="#E8590C" stroke-width="1.5"/><text x="275.0" y="165.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">Dense 32</text><text x="275.0" y="182.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">ReLU</text><rect x="360" y="120" width="80" height="100" rx="6" fill="#FBE9E7" stroke="#C0392B" stroke-width="1.5"/><text x="400.0" y="165.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">z (8)</text><text x="400.0" y="182.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">병목</text><rect x="480" y="80" width="90" height="180" rx="6" fill="#FDEEE3" stroke="#E8590C" stroke-width="1.5"/><text x="525.0" y="165.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">Dense 32</text><text x="525.0" y="182.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">ReLU</text><rect x="610" y="60" width="150" height="220" rx="6" fill="#E3F0F5" stroke="#1C6E8C" stroke-width="1.5"/><text x="685.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="600">재구성 x̂ (54)</text><rect x="800" y="60" width="180" height="100" rx="6" fill="#E6F4EC" stroke="#2E8B57" stroke-width="1.5"/><text x="890.0" y="97.8" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">특징별 오차</text><text x="890.0" y="114.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">(x − x̂)²</text><text x="890.0" y="130.2" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">→ 9특징으로 합산</text><rect x="800" y="180" width="180" height="100" rx="6" fill="#E6F4EC" stroke="#2E8B57" stroke-width="1.5"/><text x="890.0" y="217.8" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">점수 = 평균 오차 / 임계</text><text x="890.0" y="234.0" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">임계 = 정상 검증 99.5 분위</text><text x="890.0" y="250.2" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">3창 연속 초과 → 경보</text><rect x="610" y="310" width="370" height="70" rx="14" fill="#FDEEE3" stroke="#E8590C" stroke-width="1.5" stroke-dasharray="6 4"/><text x="795.0" y="340.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">근거 = 오차 상위 3개 특징 → 표 5.2 문구</text><text x="795.0" y="357.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">예: released_ahead·disp_m → &quot;허가 노드 3개 남음 · 위치 변화 0.02 m&quot;</text><rect x="20" y="310" width="560" height="70" rx="14" fill="#F3F5F7" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4"/><text x="300.0" y="340.9" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">학습: 정상 창만(seed 101~, 이상 주입 없는 운행), MSE, Adam 1e-3, 배치 256, 30 epoch</text><text x="300.0" y="357.1" font-size="12.5" text-anchor="middle" fill="#16202B" font-weight="500">평가: 주입 운행 seed 206~210 의 모든 창 → ROC·PR·사건 단위 탐지율·지연</text><path d="M190.0 170.0 L230.0 170.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M320.0 170.0 L360.0 170.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M440.0 170.0 L480.0 170.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M570.0 170.0 L610.0 170.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M760.0 148.0 L800.0 136.3" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M105.0 60.0 L105.0 30.0 L890.0 30.0 L890.0 60.0" fill="none" stroke="#4B5563" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><path d="M890.0 160.0 L890.0 180.0" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/><path d="M890.0 160.0 L890.0 295.0 L861.5 310.0" fill="none" stroke="#E8590C" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#o)"/></svg>